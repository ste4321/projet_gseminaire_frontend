  <!-- Avant le premier affichage : classe « js » (animations au défilement, remplace Modernizr)
       et thème sombre si le visiteur l'a choisi (ou, sans choix, si son système est en sombre),
       pour éviter un flash en clair. La suite est gérée par src/hooks/useTheme.js -->
  <script>
    (function () {
      var html = document.documentElement;
      html.classList.add('js');
      var choix = null;
      try { choix = localStorage.getItem('theme'); } catch (e) {}
      var sombre = choix ? choix === 'dark'
        : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (sombre) {
        html.classList.add('dark-mode');
        var barre = document.querySelector('meta[name="theme-color"]');
        if (barre) barre.setAttribute('content', '#121212');
      }
    })();
  </script>

  <!-- Écran de chargement : styles en ligne pour qu'il s'affiche tout de suite, sans attendre les CSS -->
  <style>
    .gtco-loader {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: #fff;
      transition: opacity .4s ease, visibility .4s ease;
    }
    html.dark-mode, html.dark-mode .gtco-loader { background: #121212; }
    .gtco-loader.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .gtco-loader__ring {
      position: relative; width: 84px; height: 84px; border-radius: 50%;
      border: 3px solid rgba(141, 94, 8, .15); border-top-color: #8d5e08;
      animation: gtco-spin .9s linear infinite;
    }
    .gtco-loader__logo { position: absolute; width: 48px; height: 48px; }
    @keyframes gtco-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .gtco-loader__ring { animation-duration: 2.4s; } }
  </style>
